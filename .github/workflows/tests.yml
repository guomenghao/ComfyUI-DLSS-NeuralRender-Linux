name: Python transport checks (no GPU)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pyav: ['17.1.0', '18.1.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install numpy Pillow 'av==${{ matrix.pyav }}'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - run: bash -n setup_ubuntu24.sh
      - name: Install Wine and MinGW for real command redirection test
        if: matrix.pyav == '17.1.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb xauth gcc-mingw-w64-x86-64
      - name: Real Wine binary file transport (no GPU)
        if: matrix.pyav == '17.1.0'
        env:
          V2D_TEST_REAL_WINE: '1'
        run: python -m unittest test_real_wine -v
